apply from: new File(projectDir.parentFile, 'gradle/yd-plugin-library.gradle')
android { namespace 'com.egogame.plugin.runtime' }

android {
    testOptions {
        unitTests.includeAndroidResources = true
        unitTests.all {
            systemProperty 'plugin.validation.dir', rootProject.layout.buildDirectory.dir('plugin-validation/runtime-fixtures').get().asFile.absolutePath
            def sandboxUserHome = System.getenv('TEST_USER_HOME')
            if (sandboxUserHome) systemProperty 'user.home', sandboxUserHome
            def robolectricDependencyDir = System.getenv('ROBOLECTRIC_DEPENDENCY_DIR')
            if (robolectricDependencyDir) {
                systemProperty 'robolectric.offline', 'true'
                systemProperty 'robolectric.dependency.dir', robolectricDependencyDir
            }
        }
    }
}
dependencies {
    api project(':yd-plugin-api')
    implementation project(':yd-plugin-music-api')
    implementation project(':yd-plugin-vehicle-model-api')
    testImplementation 'junit:junit:4.13.2'
    testImplementation('org.robolectric:robolectric:4.10.3') {
        exclude group: 'org.bouncycastle', module: 'bcprov-jdk18on'
    }
    testImplementation 'org.bouncycastle:bcprov-jdk15to18:1.72'
}
